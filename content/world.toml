# Avalon — world data. Terrains, settlements (destinations), cargoes, and the
# tone lint's banned list. A mission rolls one terrain; the terrain sets the
# road's length, fuel pressure, which clock will kill you, and difficulty.

banned_phrases = [
  "delve", "tapestry", "testament to", "I daresay", "I warrant",
  "vibrant", "bustling", "nestled", "—and yet—",
]

# --- terrains: the variety axis. Tuned together with engine.rs for ~60% loss.

[[terrains]]
id = "moor"
name = "the high moor"
flavor = "Open moorland, no cover and no witnesses but the sky. The Collective's spotters love it up here."
legs = 4
start_fuel_l = 24
max_fuel_l = 36
leg_fuel_l = 6
start_wear = 2
dc_mod = 1
heat_per_leg = 2
wear_per_leg = 0

