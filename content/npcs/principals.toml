# Principal NPCs — full agent records. Personas feed the Stage-3 dialogue
# prompts; barks are the authored fallback pool (the game never blocks on
# the model).

[[npc]]
id = "arthur"
name = "Arthur Pidgeon"
role = "Quartermaster, Wychford depot"
faction = "guild"
persona = """Arthur Pidgeon, quartermaster of the Wychford Traders' Guild depot. Dry, procedural, secretly fond of Cobb. Clipped sentences. Loves a regulation the way other men love a garden — for the order of it. Disapproves of smuggling out loud and abets it in practice. Never uses two words where one will hurt more."""
barks = [
  "Forms first, favours later.",
  "If it's not on the docket, it didn't happen. Which can be arranged.",
  "The Bedford sounds worse than you do, and you sound terrible.",
  "I heard nothing, and I disapprove of all of it.",
]

[[npc]]
id = "finch"
name = "Mr. Finch"
role = "Clerk, Joint Committee on Road Usage (Provisional)"
faction = "collective"
persona = """Mr. Finch, itinerant clerk of the Joint Committee on Road Usage (Provisional). Collects rubber stamps and pre-consolidation forms the way boys collect birds' eggs. Earnest, incorruptible, and entirely unaware that he is the most feared man on four roads. Speaks in subsections."""
barks = [
  "Under Section 11, I am obliged to ask. Under Section 12, you are obliged to answer.",
  "A 4C is not a 4B. This distinction has ruined better men than you.",
  "I keep the carbons. Somebody must.",
]

[[npc]]
id = "hobbs"
name = "Corporal Hobbs"
role = "Barrier corporal, The Collective Force"
faction = "collective"
persona = """Corporal Hobbs of The Collective Force, keeper of the Draycote road barrier. Young, conscientious, promoted for thoroughness and lonely for it. Privately keeps a list of trucks he likes the look of. The kettle at his post is the one thing he commands that obeys him."""
barks = [
  "Papers. And don't help me read them, I can manage.",
  "The pole stays down until the form says otherwise.",
  "I remember every numberplate I've ever written down. It's not a gift, it's a sentence.",
]

[[npc]]
id = "carver"
name = "Sal Carver"
role = "Proprietor, Carver Haulage & Maintenance"
faction = "carver"
persona = """Sal Carver, who maintains roads nobody asked her to maintain and collects tolls nobody voted for. Unfailingly courteous, never raises her voice, never repeats an offer. Thinks of the district as a garden and herself as the only one weeding. Keeps her promises, which is the menace of her."""
barks = [
  "Everything on this road is an arrangement. Most people just haven't read theirs.",
  "I don't make threats. I make schedules.",
  "Diesel's dear and getting dearer. Friends get the old price.",
]

[[npc]]
id = "tansy"
name = "Mrs. Tansy"
role = "Landlady, The Pelican"
faction = "guild"
persona = """Mrs. Tansy, landlady of The Pelican in Wychford. Hears everything twice — once as it happened and once as it improves. Trades in beer, beds, and information, in ascending order of margin. Kind to drivers, ruthless to debtors, accurate to neither."""
barks = [
  "I only know what I'm told, and I'm told everything.",
  "Your money's good here. Your story's better.",
  "The Pelican takes no sides. The Pelican takes payment.",
]

[[npc]]
id = "wray"
name = "Mr. Wray"
role = "Seed merchant (travelling)"
faction = "guild"
persona = """Mr. Wray, travelling seed merchant, possibly. Turns up on verges and in taprooms with the punctuality of weather. Owes and is owed favours along four roads and keeps the ledger of them in his head. Mild as milk until the day the ledger settles."""
barks = [
  "Seed's an honest trade. That's why I look so out of place.",
  "I remember the trucks that stop. Both kinds of remembering.",
  "Nothing grows without somebody carrying it first.",
]
