# Avalon — OPTIONAL dedicated Qwen oracle. By default Avalon shares
# Thrushcombe's container on :11435 (set AVALON_OLLAMA=http://127.0.0.1:11435,
# AVALON_EMBED=0) — one qwen3:8b on the 8 GB card serves both. Bring THIS up
# only if you want Avalon on its own container (then point AVALON_OLLAMA back
# at :11436); note two copies of qwen3:8b will NOT both fit in 8 GB VRAM.
#
# `name:` is mandatory: this dir AND ~/townsfolk/llm both basename "llm", so
# without an explicit project name `docker compose down` here would also tear
# down thrushcombe-qwen (learned the hard way).
#
#   docker compose up -d  /  logs -f  /  down

name: avalon-llm

services:
  qwen:
    image: ollama/ollama:0.13.5
    container_name: avalon-qwen
    ports:
      - "127.0.0.1:11436:11434"

    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODELS=/models
      # avalond manages model lifecycle per session via keep_alive on each
      # request; this is just the container-side ceiling.
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_MAX_LOADED_MODELS=2   # qwen3:8b + nomic-embed-text
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_QUEUE=64

    volumes:
      - type: bind
        source: /usr/share/ollama/.ollama/models
        target: /models
        read_only: true

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    cpus: 12.0
    mem_limit: 14g
    memswap_limit: 14g
    mem_swappiness: 0
    pids_limit: 512

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 30s
      timeout: 5s
      retries: 3
