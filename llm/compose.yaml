# Avalon — local Qwen oracle, capped & sandboxed. Pattern proven in
# ~/townsfolk/llm: pinned image, read-only reuse of the native model store,
# hard resource caps. Avalon gets its OWN container (port 11436) so its
# tuning never fights Thrushcombe's (11435) or the native Ollama (11434).
#
#   docker compose up -d
#   docker compose logs -f
#   docker compose down

services:
  qwen:
    image: ollama/ollama:0.13.5
    container_name: avalon-qwen
    ports:
      - "127.0.0.1:11436:11434"

    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODELS=/models
      # avalond manages model lifecycle per session via keep_alive on each
      # request; this is just the container-side ceiling.
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_MAX_LOADED_MODELS=2   # qwen3:8b + nomic-embed-text
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_QUEUE=64

    volumes:
      - type: bind
        source: /usr/share/ollama/.ollama/models
        target: /models
        read_only: true

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    cpus: 12.0
    mem_limit: 14g
    memswap_limit: 14g
    mem_swappiness: 0
    pids_limit: 512

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 30s
      timeout: 5s
      retries: 3
